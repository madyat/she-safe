<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://media.base44.com/images/public/6acdd83f62f256b9fffec1a4/45f23db88_Untitled_design.PNG" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4B2C72" />
    <link rel="manifest" href="/manifest.json" />
    <title>SHE-SAFE Ring — Safety, on your terms</title>
    <script>
      // Apply the saved theme before first paint so dark mode never flashes white.
      (function () {
        try {
          var mode = localStorage.getItem("shesafe_theme") || "system";
          var dark = mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
